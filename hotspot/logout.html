<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Hotspot - Logout</title>
    <style>
        /* ---------- RESET & BASE (sama dengan login) ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 16px;
            background-image: url('img/img.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Overlay gelap */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .main {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrap {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 32px 28px 28px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .wrap:hover {
            transform: translateY(-4px);
        }

        /* ---------- HEADER ---------- */
        .logout-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 14px;
        }

        .logout-icon {
            width: 40px;
            height: 40px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logout-icon svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .logout-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }

        /* ---------- TABEL INFO ---------- */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .info-table tr {
            border-bottom: 1px solid #f1f5f9;
        }

        .info-table tr:last-child {
            border-bottom: none;
        }

        .info-table td {
            padding: 10px 4px;
            font-size: 15px;
            color: #1e293b;
        }

        .info-table td:first-child {
            font-weight: 600;
            color: #475569;
            width: 40%;
        }

        .info-table td:last-child {
            font-weight: 500;
            text-align: right;
            color: #0f172a;
            word-break: break-word;
        }

        /* ---------- TOMBOL LOGIN KEMBALI ---------- */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            margin-top: 4px;
        }

        .btn-login:hover {
            background: #2563eb;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        /* ---------- FOOTER ---------- */
        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.3px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }

        .footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 400px) {
            .wrap {
                padding: 24px 16px 20px;
            }
            .logout-header h1 {
                font-size: 20px;
            }
            .info-table td {
                font-size: 14px;
                padding: 8px 2px;
            }
            .btn-login {
                font-size: 16px;
                padding: 12px;
            }
        }

        @media (max-height: 700px) {
            body {
                padding: 8px;
            }
            .wrap {
                padding: 18px 20px 16px;
                max-width: 380px;
            }
            .logout-header {
                margin-bottom: 12px;
                padding-bottom: 10px;
            }
            .logout-header h1 {
                font-size: 20px;
            }
            .logout-icon {
                width: 32px;
                height: 32px;
            }
            .logout-icon svg {
                width: 18px;
                height: 18px;
            }
            .info-table td {
                padding: 6px 2px;
                font-size: 13px;
            }
            .btn-login {
                padding: 10px;
                font-size: 16px;
            }
            .footer {
                margin-top: 14px;
                padding-top: 10px;
                font-size: 12px;
            }
        }

        @media (min-width: 600px) {
            .wrap {
                padding: 40px 40px 32px;
                max-width: 440px;
            }
            .logout-header h1 {
                font-size: 28px;
            }
            .btn-login {
                font-size: 20px;
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== FUNGSI ASLI (tetap dipertahankan) ===== -->
    <script>
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_blank', '');
            window.close();
            return false;
        }
    </script>
    <!-- ============================================ -->

    <div class="main">
        <div class="wrap">

            <!-- HEADER dengan ikon logout -->
            <div class="logout-header">
                <div class="logout-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg>
                </div>
                <h1>Anda telah logout!</h1>
            </div>

            <!-- TABEL informasi sesi -->
            <table class="info-table">
                <tr>
                    <td>Username</td>
                    <td>$(username)</td>
                </tr>
                <tr>
                    <td>Alamat IP</td>
                    <td>$(ip)</td>
                </tr>
                <tr>
                    <td>Alamat MAC</td>
                    <td>$(mac)</td>
                </tr>
                <tr>
                    <td>Lama sesi</td>
                    <td>$(uptime)</td>
                </tr>
                $(if session-time-left)
                <tr>
                    <td>Sisa waktu</td>
                    <td>$(session-time-left)</td>
                </tr>
                $(endif)
                <tr>
                    <td>Traffic (↓ / ↑)</td>
                    <td>$(bytes-in-nice) / $(bytes-out-nice)</td>
                </tr>
            </table>

            <!-- FORM untuk login kembali -->
            <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                <input type="submit" class="btn-login" value="Login kembali">
            </form>

            <!-- FOOTER (sama dengan login) -->
            <div class="footer">
                <p>© 2026 Shikikan Neko. image by <a href="https://www.pixiv.net/en/users/13408349" target="_blank">natsumikan.</a></p>
            </div>

        </div>
    </div>

</body>
</html>
