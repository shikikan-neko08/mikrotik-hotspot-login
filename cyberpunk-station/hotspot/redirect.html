<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090e17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet Hotspot - Redirect</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function startClock() {
            $(if popup == 'true')
            open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=340,height=440');
            $(endif)
            location.href = unescape('$(link-redirect-esc)');
        }
    </script> 
</head>
<body onLoad="startClock()">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <h1>Logged In</h1>
                <div class="spinner"></div>
                <p class="info" style="font-weight: 500; margin-top: 10px;">Connecting to the Internet...</p>
                <p class="info" style="margin-top: 12px; font-size: 12px;">
                    If nothing happens, <a href="$(link-redirect)">click here</a>
                </p>
                <p class="powered">Powered by MikroTik RouterOS</p>
            </div>
        </div>
    </div>
</body>
</html>
