<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090e17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet Hotspot - Log out</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_blank', '');
            window.close();
            return false;
        }
    </script>
</head>
<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <h1>Logged Out</h1> 
                <p class="info">You have successfully logged out.</p>

                <table>  
                    <tr>
                        <td>Username</td>
                        <td>$(username)</td>
                    </tr>
                    <tr>
                        <td>IP Address</td>
                        <td>$(ip)</td>
                    </tr>
                    <tr>
                        <td>MAC Address</td>
                        <td>$(mac)</td>
                    </tr>
                    <tr>
                        <td>Session Time</td>
                        <td>$(uptime)</td>
                    </tr>
                    $(if session-time-left)
                    <tr>
                        <td>Time Left</td>
                        <td>$(session-time-left)</td>
                    </tr>
                    $(endif)
                    <tr>
                        <td>Bytes Up / Down</td>
                        <td>$(bytes-in-nice) / $(bytes-out-nice)</td>
                    </tr>
                </table>

                <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                    <input type="submit" value="Log in Again" />
                </form>

                <p class="powered">Powered by MikroTik RouterOS</p>
            </div>
        </div>
    </div>
</body>
</html>
