<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="-1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotspot - Login</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            /* penting agar flex centering bekerja sempurna */
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            align-items: center;
            /* tengah vertikal */
            justify-content: center;
            /* tengah horizontal */
            min-height: 100vh;
            /* fallback */
            min-height: 100dvh;
            /* dynamic viewport height untuk mobile */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 16px;
            /* Background gambar */
            background-image: url('img/img.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Overlay gelap */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .main {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrap {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 32px 28px 28px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .wrap:hover {
            transform: translateY(-4px);
        }

        /* ---------- FORM ---------- */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Logo */
        .logo {
            display: block;
            max-width: 150px;
            width: 100%;
            height: auto;
            margin: 0 auto 12px;
            flex-shrink: 0;
        }

        /* Greeting */
        .greeting {
            text-align: center;
            margin-bottom: 4px;
        }

        .greeting h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.5px;
        }

        .greeting p {
            font-size: 15px;
            color: #555;
            margin-top: 2px;
            font-weight: 400;
        }

        /* Info / error */
        .info {
            text-align: center;
            font-size: 14px;
            color: #444;
            padding: 10px 12px;
            border-radius: 10px;
            background: #f0f4ff;
            line-height: 1.5;
            word-break: break-word;
        }

        .info.alert {
            background: #fee2e2;
            color: #b91c1c;
        }

        .info a {
            color: #2563eb;
            text-decoration: underline;
            font-weight: 600;
        }

        /* Label (input + icon) */
        label {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 0 16px;
            transition: 0.2s;
            border: 2px solid transparent;
            flex-shrink: 0;
        }

        label:focus-within {
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .ico {
            width: 20px;
            height: 20px;
            opacity: 0.5;
            margin-right: 12px;
            flex-shrink: 0;
        }

        label input[type="text"],
        label input[type="password"] {
            width: 100%;
            padding: 14px 0;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #1e293b;
            outline: none;
            font-weight: 500;
            min-width: 0;
        }

        label input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        /* Tombol Login */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            margin-top: 4px;
            flex-shrink: 0;
        }

        .btn-login:hover {
            background: #2563eb;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        /* Footer */
        .bt {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .bt a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .bt a:hover {
            text-decoration: underline;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 400px) {
            .wrap {
                padding: 24px 16px 20px;
            }
            .greeting h1 {
                font-size: 24px;
            }
            .greeting p {
                font-size: 14px;
            }
            .btn-login {
                font-size: 16px;
                padding: 12px;
            }
            .logo {
                max-width: 120px;
            }
            label input[type="text"],
            label input[type="password"] {
                padding: 12px 0;
                font-size: 15px;
            }
        }

        @media (max-height: 700px) {
            body {
                padding: 8px;
                align-items: center;
                /* tetap tengah walaupun layar pendek */
            }
            .wrap {
                padding: 20px 24px 18px;
                max-width: 380px;
            }
            .logo {
                max-width: 100px;
                margin-bottom: 6px;
            }
            .greeting {
                margin-bottom: 0;
            }
            .greeting h1 {
                font-size: 22px;
            }
            form {
                gap: 10px;
            }
            label input[type="text"],
            label input[type="password"] {
                padding: 10px 0;
            }
            .btn-login {
                padding: 10px;
                font-size: 16px;
            }
            .bt {
                margin-top: 12px;
                font-size: 12px;
            }
        }

        @media (min-width: 600px) {
            .wrap {
                padding: 40px 40px 32px;
                max-width: 420px;
            }
            .greeting h1 {
                font-size: 32px;
            }
            .btn-login {
                font-size: 20px;
                padding: 16px;
            }
        }

        @media (min-width: 1024px) {
            .wrap {
                max-width: 440px;
                padding: 48px 48px 36px;
                border-radius: 24px;
            }
            .btn-login:hover {
                transform: scale(1.04);
            }
        }
    </style>
</head>

<body>

    <!-- ===== BAGIAN CHAP (tetap dipertahankan) ===== -->
    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
    </form>

    <script src="/md5.js"></script>
    <script>
        function doLogin() {
            document.sendin.username.value = document.login.username.value;
            document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
            document.sendin.submit();
            return false;
        }
    </script>
    $(endif)
    <!-- ============================================ -->

    <div class="main">
        <div class="wrap">

            <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                <!-- Hidden fields wajib -->
                <input type="hidden" name="dst" value="$(link-orig)" />
                <input type="hidden" name="popup" value="true" />

                <!-- Logo -->
                <svg class="logo" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 42">
                    <path fill="#1a1a2e" d="M7.32 13.66L0 41.74 3.12 41.74 9.49 15.94 9.58 15.94 15.01 41.74 18.22 41.74 36.86 16.34 36.95 16.34 30.02 41.74 33.18 41.74 40.4 13.66 35.73 13.66 17.23 38.87 11.99 13.66 7.32 13.66zM43.43 21.45L38.19 41.74 41.16 41.74 46.4 21.45 43.43 21.45zM50.68 21.45L45.5 41.74 48.47 41.74 50.36 34.39 55.55 30.77 62.02 41.74 65.27 41.74 57.91 29.28 69.43 21.45 65.46 21.45 51.21 31.36 51.12 31.28 53.66 21.45 50.68 21.45z" />
                    <path d="M71.18 21.45L65.94 41.74h3l2.74-10.62c1-3.81 3.82-7.39 9.16-7.47.56 0 1.13 0 1.7 0l.66-2.48c-.52 0-1.09 0-1.61 0-4.34 0-6.94 2-8.82 5h-.1l1.23-4.68zM103.8 28.8c0-5-4-7.94-9.63-7.94-8.69 0-13.59 6.37-13.59 13 0 5.07 3.44 8.45 9.72 8.45 9 0 13.5-6.68 13.5-13.53m-3 .52c0 4.72-3.44 10.93-9.95 10.93-5 0-7.32-2.68-7.32-6.61 0-4.76 3.59-10.7 10.1-10.7 4.77 0 7.17 2.6 7.17 6.38M132.33 21.43L134.26 13.66 105.19 13.66 103.27 21.45 112.59 21.45 112.59 21.45 122.99 21.45 122.99 21.45 132.33 21.43zM111.67 25.17L107.55 41.74 117.93 41.74 122.06 25.17 122.06 25.16 111.67 25.16 111.67 25.17zM134 25.17l-4.11 16.57h9.35l4.1-16.57zm10.28-3.73l1.94-7.78h-9.34l-2 7.79zM150.09 13.66L143.11 41.74 152.45 41.74 153.91 35.92 156.04 34.34 159.34 41.74 169.49 41.74 163.26 29.55 174.26 21.33 163.07 21.33 156.18 27.3 156.09 27.3 159.44 13.66 150.09 13.66zM47.45 0c1.14 7.93 5.39 12.74 14.07 13.14A10.69 10.69 0 0 1 47.45 0" fill="#1a1a2e" fill-rule="evenodd" />
                    <path d="M42.91,1.4c.1,0,.11,0,.12.11A16.55,16.55,0,0,0,48.26,13a16.6,16.6,0,0,0,12,4.66c-10,4-20.55-5.6-17.33-16.28" fill="#1a1a2e" fill-rule="evenodd" />
                </svg>

                <!-- Greeting -->
                <div class="greeting">
                    <h1>Selamat Datang</h1>
                    <p>Silahkan login untuk menggunakan hotspot.</p>
                </div>

                <!-- Pesan info / error -->
                <p class="info $(if error)alert$(endif)">
                    $(if error == "")
                        Masukkan username dan password untuk login.
                        $(if trial == 'yes')
                            <br />Tersedia uji coba gratis, <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">klik di sini</a>.
                        $(endif)
                    $(endif)
                    $(if error)$(error)$(endif)
                </p>

                <!-- Username -->
                <label>
                    <img class="ico" src="img/user.svg" alt="user" />
                    <input name="username" type="text" value="$(username)" placeholder="Username" autofocus />
                </label>

                <!-- Password -->
                <label>
                    <img class="ico" src="img/password.svg" alt="password" />
                    <input name="password" type="password" placeholder="Password" />
                </label>

                <!-- Tombol Login -->
                <input type="submit" class="btn-login" value="Login" />

            </form>

            <!-- Footer -->
            <p class="bt">© 2026 Shikikan Neko. image by<a href="https://www.pixiv.net/en/users/13408349" target="_blank"> natsumikan.</a></p>

        </div>
    </div>

</body>
</html>
